<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="6" fill="#09090b"/>
  <!-- Orbit ring -->
  <ellipse cx="16" cy="16" rx="14" ry="5.5" stroke="#4ade80" stroke-width="1" stroke-opacity="0.35" transform="rotate(-22 16 16)"/>
  <!-- Globe body -->
  <circle cx="16" cy="16" r="10" stroke="#4ade80" stroke-width="2" fill="rgba(74,222,128,0.07)"/>
  <!-- Equator -->
  <ellipse cx="16" cy="16" rx="10" ry="3.3" stroke="#4ade80" stroke-width="1" stroke-opacity="0.45"/>
  <!-- Prime meridian -->
  <line x1="16" y1="6" x2="16" y2="26" stroke="#4ade80" stroke-width="1" stroke-opacity="0.45"/>
  <!-- Orbiting satellite -->
  <circle cx="27.5" cy="11" r="2.2" fill="#4ade80"/>
</svg>
